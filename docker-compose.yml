services:
  backend:
    image: ghcr.io/jp-cano/personal-portfolio-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - DB_DRIVER=${DB_DRIVER}
      - DATABASE_PATH=${DATABASE_PATH:-portfolio.db}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
      - DEBUG=${DEBUG:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-portfolio_session}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE}
    volumes:
      - ./data/backend:/home/appuser/data
      - ./data/certifications:/home/appuser/pkg/assets/career-certifications
    networks:
      - portfolio-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/jp-cano/personal-portfolio-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    environment:
      - PORT=${PORT:-3000}
      - PORTFOLIO_BACKEND_URL=${PORTFOLIO_BACKEND_URL:-http://backend:8080/api/v1}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portfolio-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    container_name: portfolio-caddy
    restart: unless-stopped
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
      - SSL_EMAIL=${SSL_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - portfolio-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  portfolio-network:
    driver: bridge

volumes:
  data:
